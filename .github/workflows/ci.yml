name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static analysis, code style, and the JS toolchain. These gates are
  # PHP/WordPress-version independent, so they run once (PHP 8.2) rather than
  # across the whole matrix. The job is required, so a failure fails the run.
  static:
    name: Static analysis & front-end (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, openssl, mbstring
          coverage: none
          tools: composer:v2

      - name: Composer install
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPCS (WordPress-Extra + PSR-12 + PHPCompatibility)
        run: composer phpcs

      - name: PHPStan (level 6)
        run: composer phpstan

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: NPM install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Jest
        run: npm test

      - name: Vite build
        run: npm run build

  # PHPUnit integration suite across the supported PHP and WordPress versions
  # against a real MySQL 8 server.
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }} / WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        wp: ['latest', '6.8']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_TESTS_PHPUNIT_POLYFILLS_PATH: ${{ github.workspace }}/vendor/yoast/phpunit-polyfills
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, openssl, mbstring
          coverage: none
          tools: composer:v2

      - name: Composer install
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install Subversion (for the WP test library)
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install WordPress test library
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }} true

      - name: PHPUnit
        run: vendor/bin/phpunit
